name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_test
          POSTGRES_DB: invoice_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d invoice_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://erp:erp_test@127.0.0.1:5432/invoice_erp_test
      TEST_DATABASE_URL: postgresql://erp:erp_test@127.0.0.1:5432/invoice_erp_test
      DISABLE_RECURRING_SCHEDULER: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Europe/Vienna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npm run build
